id: service_unavailable
version: 1.0.0
name: Service unavailable diagnosis
trigger:
  alert_name: Service*Unavailable
  severity: critical
steps:
  - id: query_alert
    tool: query_prometheus_alerts
    risk_level: read_only
  - id: query_logs
    tool: search_log
    arguments: {window_minutes: 15}
    risk_level: read_only
  - id: query_deployments
    tool: query_recent_deployments
    arguments: {window_minutes: 30}
    risk_level: read_only
stop_conditions: [no_active_alert, max_steps_reached]
expected_evidence: [availability_metric, error_logs, recent_changes]
